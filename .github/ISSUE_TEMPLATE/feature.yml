name: Feature request
description: Suggest an API capability or server improvement.
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the problem and the behavior that would help.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: API documentation or examples
      description: Link relevant public documentation; omit credentials and private data.
